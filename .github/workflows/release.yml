name: Draft release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Verify annotated tag and default-branch ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] || exit 1
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = tag
          test "$(git rev-parse HEAD)" = "$(git rev-parse "$RELEASE_TAG^{commit}")"
          git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"
      - name: Verify package and changelog version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import ast
          import os
          from pathlib import Path
          tag_version = os.environ["RELEASE_TAG"][1:]
          source = Path("src/ue5_ubt_config_wizard/__init__.py")
          assignments = ast.parse(source.read_text(encoding="utf-8")).body
          versions = [
              ast.literal_eval(node.value)
              for node in assignments if isinstance(node, ast.Assign)
              if any(isinstance(t, ast.Name) and t.id == "__version__" for t in node.targets)
          ]
          if versions != [tag_version]:
              raise SystemExit(f"Package version {versions!r} differs from tag {tag_version!r}")
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          if not any(line.startswith(f"## [{tag_version}]") for line in lines):
              raise SystemExit("Changelog has no matching release heading")
          PY

  checks:
    needs: validate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    needs: [validate, checks]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          # Runner/architecture reference:
          # https://docs.github.com/en/actions/reference/runners/github-hosted-runners
          - os: windows-latest
            architecture: x64
            machine: AMD64
            asset: windows-x64
          - os: ubuntu-24.04
            architecture: x64
            machine: x86_64
            asset: linux-x64
          - os: macos-15
            architecture: arm64
            machine: arm64
            asset: macos-arm64
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - name: Verify native architecture
        env:
          EXPECTED_MACHINE: ${{ matrix.machine }}
        run: python -c "import os,platform; assert platform.machine().lower() == os.environ['EXPECTED_MACHINE'].lower(), platform.machine()"
      - name: Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libgl1 libxkbcommon0 libxcb-cursor0
      - name: Install
        run: python -m pip install -c requirements-dev.lock ".[dev]"
      - name: Build and smoke-test portable native directory
        run: python tools/build_native.py
      - name: Build Python distributions once
        if: runner.os == 'Linux'
        run: |
          python -m build
          python tools/smoke_install.py
          python -c "from pathlib import Path; import shutil; [shutil.copy2(p, 'release-assets') for p in Path('dist').iterdir() if p.is_file() and (p.suffix == '.whl' or p.name.endswith('.tar.gz'))]"
      # https://github.com/actions/upload-artifact/releases
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.asset }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [validate, checks, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # Download the same run's tested build products; no PR artifact handoff.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Verify expected assets and create checksums
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("release-assets")
          expected = ("*-windows-amd64.zip", "*-linux-x86_64.tar.gz",
                      "*-darwin-arm64.tar.gz", "*.whl", "ue5_ubt_config_wizard-*.tar.gz")
          for pattern in expected:
              found = list(root.glob(pattern))
              if len(found) != 1:
                  raise SystemExit(f"Expected one {pattern}, found {found}")
          files = sorted(root.iterdir())
          lines = [f"{hashlib.sha256(p.read_bytes()).hexdigest()}  {p.name}" for p in files]
          (root / "SHA256SUMS.txt").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Prepare owner-reviewable release notes
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          notes = (
              f"Draft release {tag}\n\n"
              "Application checks ran on Windows, Ubuntu and macOS with Python 3.12/3.13.\n"
              "Portable native archives target Windows x64, Ubuntu x64 and macOS ARM64.\n"
              "Extract the entire directory; these are unsigned onedir bundles, not installers.\n\n"
              "Exact Unreal Engine acceptance and complete UE5 flag coverage remain unverified.\n"
              "Review CHANGELOG.md, supported-engines.md and collected dependency notices before publication.\n"
              "SHA256SUMS.txt records the attached assets.\n"
          )
          Path("release-notes.md").write_text(notes, encoding="utf-8")
          PY
      - name: Create draft only; owner publishes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        # --verify-tag prevents creation of a tag from an unintended branch.
        # https://cli.github.com/manual/gh_release_create
        run: |
          gh release create "$RELEASE_TAG" release-assets/* \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Release $RELEASE_TAG" \
            --notes-file release-notes.md
