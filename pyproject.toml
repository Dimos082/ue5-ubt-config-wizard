[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ue5-ubt-config-wizard"
dynamic = ["version"]
description = "A local desktop editor for UnrealBuildTool BuildConfiguration.xml profiles"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{name = "UE5 UBT Configuration Wizard contributors"}]
dependencies = ["PySide6>=6.11.2,<6.12", "lxml>=6.1.3,<7", "psutil>=7,<9"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Topic :: Software Development :: Build Tools",
]

[project.optional-dependencies]
dev = ["pytest>=9.1.1,<10", "pytest-qt>=4.5,<5", "ruff>=0.16.9,<0.17", "build>=1.6.1,<2", "pyinstaller>=6.22.3,<7"]

[project.scripts]
ue5-ubt-config-wizard = "ue5_ubt_config_wizard.__main__:main"

[project.urls]
Repository = "https://github.com/Dimos082/ue5-ubt-config-wizard"
Issues = "https://github.com/Dimos082/ue5-ubt-config-wizard/issues"
Releases = "https://github.com/Dimos082/ue5-ubt-config-wizard/releases"

[tool.setuptools.dynamic]
version = {attr = "ue5_ubt_config_wizard.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ue5_ubt_config_wizard = ["catalogs/*.toml", "catalogs/*.json", "catalogs/*.md", "catalogs/*.xml", "catalogs/*.xsd", "assets/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers -m 'not engine'"
qt_api = "pyside6"
markers = ["engine: owner-enabled tests requiring a real Unreal installation"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp", ".venv", "build", "catalog-cache", "dist", "release-assets", "scratch"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
